[package]
name = "fabio-claw"
version = "0.2.0"
edition = "2021"
description = "Edge-first embedded LLM agent runtime for Raspberry Pi and Linux edge boards"
authors = ["Fabio Lonardoni"]
license = "MIT"
readme = "README.md"
repository = "https://github.com/lonardonifabio/fabio-claw"
keywords = ["llm", "edge-ai", "embedded", "inference", "raspberry-pi", "agent"]
categories = ["embedded", "network-programming"]

[[bin]]
name = "fabio-claw"
path = "src/main.rs"

[dependencies]
# HTTP server
axum = { version = "0.7", features = ["json"] }
tokio = { version = "1", features = ["full"] }
tower = "0.4"
tower-http = { version = "0.5", features = ["cors", "trace"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# LLM inference — high-level bindings to llama.cpp (builds from source, no libclang needed at runtime)
llama_cpp = "0.3"

# Database
rusqlite = { version = "0.31", features = ["bundled"] }

# Cryptography (device identity + plugin signature verification)
ed25519-dalek = { version = "2", features = ["rand_core"] }
rand = "0.8"
hex = "0.4"

# Logging & tracing
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# Error handling
thiserror = "1"
anyhow = "1"

# UUID
uuid = { version = "1", features = ["v4"] }

# Time
chrono = { version = "0.4", features = ["serde"] }

# Async process (replaces polling with proper async I/O)
tokio-process = "0.2"

# Scheduler (cron-style persistent tasks)
cron = "0.12"

# Telegram bot (lightweight polling)
teloxide = { version = "0.12", features = ["macros"], optional = true }

# HTTP client for Telegram and webhooks
reqwest = { version = "0.12", features = ["json"], optional = true }

# JSON Schema for tool calling
schemars = "0.8"

# Base64 for signature encoding
base64 = "0.22"

[features]
default = []
telegram = ["teloxide", "reqwest"]

[dev-dependencies]
reqwest = { version = "0.12", features = ["json"] }
tokio-test = "0.4"
axum-test = "0.3"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
